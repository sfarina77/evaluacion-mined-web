<!doctype html>
<html lang="es-SV">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Examen de prueba</title>
<style>
  body { margin: 0; padding: 6vh 8vw; background: #ffffff; color: #0f172a; font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
  h1 { font-size: 1.5rem; }
  fieldset { border: 1px solid #cbd5e1; border-radius: 8px; margin: 0 0 16px; padding: 12px 16px; }
</style>
</head>
<body>
  <!-- Examen de prueba servido por la propia PWA (código TEST01): el sitio
       público que se usaba antes (mined.gob.sv) envía X-Frame-Options
       SAMEORIGIN y el navegador se niega a mostrarlo dentro del iframe. -->
  <h1>Examen de prueba</h1>
  <p>Esta página solo sirve para probar el flujo completo (login, cámara, supervisión y salida por PIN).</p>
  <fieldset>
    <legend>1. ¿Cuánto es 2 + 2?</legend>
    <label><input type="radio" name="p1" /> 3</label><br />
    <label><input type="radio" name="p1" /> 4</label><br />
    <label><input type="radio" name="p1" /> 5</label>
  </fieldset>
  <fieldset>
    <legend>2. Capital de El Salvador</legend>
    <input type="text" placeholder="Respuesta" />
  </fieldset>
</body>
</html>
